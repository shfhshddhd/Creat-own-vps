name: VPS Infrastructure Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check VPS Resources
        run: |
          echo "===== VPS INFORMATION ====="
          echo "Hostname:"
          hostname

          echo
          echo "CPU:"
          nproc

          echo
          echo "RAM:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Ubuntu:"
          lsb_release -a

          echo
          echo "Public IP:"
          curl -4 https://api.ipify.org
          echo
          
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          tailscale version

      - name: Connect to Tailscale
        run: |
          sudo tailscale up --auth-key=${{ secrets.TS_AUTHKEY }}
          tailscale status
          tailscale ip -4

      - name: Install and Configure SSH
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo useradd -m -s /bin/bash vpsadmin || true
          echo "vpsadmin:$VPS_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo vpsadmin
          sudo systemctl enable --now ssh

          echo "===== SSH STATUS ====="
          sudo systemctl status ssh --no-pager

      - name: Keep VPS Alive
        run: |
          sleep 3600
    
